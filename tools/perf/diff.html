<!doctype html><meta charset="utf-8"><body><script>
async function load(u) { const i = new Image(); i.src = u; await i.decode(); return i; }
window.diff = async (name, A, B) => {
  const [a, b] = await Promise.all([load('shots-' + A + '/' + name + '.png'), load('shots-' + B + '/' + name + '.png')]);
  const w = a.naturalWidth, h = a.naturalHeight;
  const ca = new OffscreenCanvas(w, h), cb = new OffscreenCanvas(w, h);
  const xa = ca.getContext('2d', { willReadFrequently: true }), xb = cb.getContext('2d', { willReadFrequently: true });
  xa.drawImage(a, 0, 0); xb.drawImage(b, 0, 0);
  const da = xa.getImageData(0, 0, w, h).data, db = xb.getImageData(0, 0, w, h).data;
  const out = new OffscreenCanvas(w, h), xo = out.getContext('2d'), od = xo.createImageData(w, h);
  let sum = 0, max = 0, n1 = 0, n8 = 0, n32 = 0, minX = w, minY = h, maxX = -1, maxY = -1;
  for (let i = 0, px = 0; i < da.length; i += 4, px++) {
    const d = Math.max(Math.abs(da[i] - db[i]), Math.abs(da[i + 1] - db[i + 1]), Math.abs(da[i + 2] - db[i + 2]));
    sum += d; if (d > max) max = d; if (d > 1) n1++; if (d > 8) { n8++; const x = px % w, y = (px - x) / w; if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; } if (d > 32) n32++;
    const v = Math.min(255, d * 8); od.data[i] = v; od.data[i + 1] = d > 8 ? 0 : v; od.data[i + 2] = d > 8 ? 0 : v; od.data[i + 3] = 255;
  }
  xo.putImageData(od, 0, 0);
  const blob = await out.convertToBlob({ type: 'image/png' });
  const buf = new Uint8Array(await blob.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return { name, w, h, mean: +(sum / (w * h)).toFixed(4), max, over1: n1, over8: n8, over32: n32, pctOver8: +(n8 / (w * h) * 100).toFixed(3), bbox8: maxX < 0 ? null : [minX, minY, maxX, maxY], png: btoa(s) };
};
</script>
